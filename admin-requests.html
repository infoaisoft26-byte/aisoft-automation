<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07152f">
<title>Service Requests · AISOFT Automation</title>
<style>
:root{color-scheme:dark;--bg:#07152f;--panel:#0d2041;--text:#f4f7ff;--muted:#aab8d2;--blue:#3984ff;--cyan:#21d4e8;--line:#21365b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#14356b,transparent 36%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,Segoe UI,Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}.top{padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}a{color:#8debf0}.brand{font-weight:850;letter-spacing:.08em}.panel{background:#0d2041;border:1px solid var(--line);border-radius:18px;padding:22px;margin:24px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:7px;flex:1;min-width:220px;color:var(--muted);font-size:13px;font-weight:700}input,select{padding:12px;border:1px solid #345078;border-radius:10px;background:#07162e;color:var(--text);font:inherit;width:100%}button{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(110deg,var(--blue),var(--cyan));color:#06152d;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{color:var(--muted);min-height:24px;margin:12px 0 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#a9c7e8}td{font-size:13px}td small{display:block;color:var(--muted);margin-top:5px;max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid #355780;border-radius:999px;padding:3px 8px;font-size:11px}.hidden{display:none!important}.muted{color:var(--muted)}h1{font-size:clamp(26px,4vw,38px);margin:24px 0 5px}
</style></head>
<body><div class="wrap">
<header class="top"><a class="brand" href="/">AISOFT AUTOMATION</a><a href="/">View website ↗</a></header>
<h1>Service requests</h1><p class="muted">Private admin view. The admin key is sent only to the same-origin API and is not saved after the page is closed.</p>
<section class="panel"><form id="auth-form"><div class="row"><label class="field">AISOFT admin key<input id="admin-key" type="password" required minlength="32" autocomplete="current-password" placeholder="Paste AISOFT_ADMIN_KEY"></label><button id="load" type="submit">Load requests</button></div></form><p class="status" id="status" role="status" aria-live="polite"></p></section>
<section class="panel hidden" id="results"><div class="row" style="justify-content:space-between"><div><strong id="count">0 requests</strong><p class="muted" style="margin:4px 0">Newest requests first · refresh to get latest</p></div><button id="refresh" type="button">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Received</th><th>Contact</th><th>Business</th><th>Request</th><th>Details / reference</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div>
<script>
(function(){
var form=document.getElementById('auth-form'),keyInput=document.getElementById('admin-key'),status=document.getElementById('status'),results=document.getElementById('results'),rows=document.getElementById('rows'),load=document.getElementById('load'),refresh=document.getElementById('refresh'),key='';
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
async function fetchRows(){key=keyInput.value.trim();if(key.length<32){status.textContent='Enter the admin key configured in Vercel.';return}load.disabled=true;refresh.disabled=true;status.textContent='Loading…';try{var response=await fetch('/api/service-requests?limit=100',{headers:{Authorization:'Bearer '+key},cache:'no-store'});var data=await response.json().catch(function(){return {}});if(!response.ok)throw new Error(data.error||'Could not load requests');var list=data.requests||[];rows.innerHTML=list.map(function(item){return '<tr><td>'+esc(new Date(item.created_at).toLocaleString())+'</td><td><strong>'+esc(item.name)+'</strong><small>'+esc(item.email)+'</small></td><td>'+esc(item.business_name||'—')+'<small>'+esc(item.business_type)+'</small></td><td><span class="tag">'+esc(item.request_type)+'</span><small>Budget: '+esc(item.budget||'Not specified')+'</small></td><td><strong>'+esc(item.reference)+'</strong><small>'+esc(item.details)+'</small></td><td><span class="tag">'+esc(item.status)+'</span></td></tr>'}).join('');document.getElementById('count').textContent=list.length+' request'+(list.length===1?'':'s');results.classList.remove('hidden');status.textContent='Loaded successfully. Requests are private to authorized admins.';}catch(error){results.classList.add('hidden');status.textContent=error.message||'Could not load requests.';}finally{load.disabled=false;refresh.disabled=false}}
form.addEventListener('submit',function(event){event.preventDefault();fetchRows()});refresh.addEventListener('click',fetchRows);
})();
</script></body></html>
